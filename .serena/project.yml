# Serena project configuration
# Project: DecisionOps Inventory DSS

project_name: "decisionops-inventory-dss"

# JavaScript/React is analyzed through the TypeScript language server.
languages:
  - typescript
  - html
  - scss
  - json

encoding: "utf-8"

# No command needs to run before Serena activates the project.
activation_command: null
activation_command_timeout: 180.0

# Use the native line endings of macOS.
line_ending: "native"

# Let Serena use the globally configured backend.
# Normally this will be LSP.
language_backend: null

# Respect the project's .gitignore.
ignore_all_files_in_gitignore: true

# Language-server-specific configuration.
ls_specific_settings: {}

# Analyze the whole repository.
ls_workspace_folders:
  - "."

# No external/sibling workspaces are needed.
ls_additional_workspace_folders: []

# Ignore generated or irrelevant directories.
ignored_paths:
  - "node_modules/**"
  - "dist/**"
  - "coverage/**"
  - ".git/**"
  - ".serena/cache/**"

# Allow Serena to edit code when requested.
read_only: false

# Use Serena's default tool set.
excluded_tools: []
included_optional_tools: []
fixed_tools: []

# Use the default Serena modes.
default_modes: null
added_modes: null

# Instructions Serena receives when this project is activated.
initial_prompt: |
  This project is DecisionOps Inventory DSS, a React application for
  inventory and logistics decision support.

  Before making changes, inspect the repository structure and existing
  implementation.

  Follow the project instructions located in:
  - .agents/rules/project-rules.md
  - .agents/rules/ponytail.md
  - .agents/rules/antigravity-rtk-rules.md
  - docs/ANTIGRAVITY_MASTER_PROMPT_INVENTORY_DSS.md

  Academic requirements are mandatory and must not be removed for
  simplification.

  Reuse existing code before creating new abstractions.

  Keep UI, business logic, and data-access logic separated.

  Inventory risk calculations must have a single source of truth.

  The React application must remain functional without n8n. n8n integration
  should occur through the configured webhook service.

  Use Serena symbolic tools for codebase navigation and reference analysis
  when appropriate.

# Symbol information retrieval budget.
# Null means Serena will use its global configuration.
symbol_info_budget: null

# Serena memory configuration.
read_only_memory_patterns: []
ignored_memory_patterns: []